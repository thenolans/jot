<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The schemes the page supports, read by the browser before the CSS loads (an installed app's
         Android navigation bar follows it); a picked theme narrows it (applyTheme). -->
    <meta name="color-scheme" content="light dark" />
    <!-- The color of the phone's status bar when installed: the top bar's (--color-bar) in each theme. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#0e1b1f"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <title>Jot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
