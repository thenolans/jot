<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- The schemes the page supports, read by the browser before the CSS loads; a picked theme
         narrows it (applyTheme). -->
    <meta name="color-scheme" content="light dark" />
    <!-- The color of the phone's status bar: the top bar's (--color-bar) in each theme. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#0e1b1f"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <title>Jot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
